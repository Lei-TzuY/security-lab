name: validate milestone 28A multi-volume rebase

on:
  push:
    branches: [tmp-28a-multi-volume-rebase]

permissions:
  contents: write

jobs:
  rebase-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply previously verified 28A implementation onto current main
        run: |
          git fetch --no-tags --depth=20 origin tmp-28a-multi-volume-generator
          git diff --binary 2ed8eff4ab2058f43b0a510fde22d6492561b6a8 d78a137040302c6f44cce73949fab1129ad04ecd -- \
            src/authority_delta.rs \
            src/authority_manifest.rs \
            src/lib.rs \
            src/platform/linux.rs \
            src/policy.rs \
            src/policy_preflight/configured_filesystem_probe.rs \
            tests/authority_delta_cli.rs \
            tests/authority_manifest_cli.rs \
            tests/fixtures/probe.S \
            tests/sandbox.rs > /tmp/milestone-28a.patch
          test -s /tmp/milestone-28a.patch
          git apply --3way /tmp/milestone-28a.patch
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction workflow and publish clean rebased candidate
        run: |
          rm .github/workflows/tmp-28a-multi-volume-rebase.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'no rebased candidate changes'; exit 1; }
          git commit -m "feat: add bounded named persistent volumes"
          git push origin HEAD:tmp-28a-multi-volume-rebase
