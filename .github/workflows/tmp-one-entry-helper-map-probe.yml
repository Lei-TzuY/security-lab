name: probe one-entry delegated identity map

on:
  push:
    branches: [tmp-supplementary-group-feasibility]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable user namespace capability probes
        run: |
          set -eu
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Probe one-entry helper mapping
        shell: bash
        run: |
          set -euo pipefail
          command -v newuidmap
          command -v newgidmap
          python3 - <<'PY'
          import ctypes, os, signal, subprocess
          CLONE_NEWNS=0x00020000
          CLONE_NEWUTS=0x04000000
          CLONE_NEWIPC=0x08000000
          CLONE_NEWUSER=0x10000000
          CLONE_NEWPID=0x20000000
          CLONE_NEWNET=0x40000000
          flags=CLONE_NEWUSER|CLONE_NEWNS|CLONE_NEWPID|CLONE_NEWNET|CLONE_NEWIPC|CLONE_NEWUTS
          libc=ctypes.CDLL(None,use_errno=True)
          uid=os.getuid(); gid=os.getgid()
          ready_r,ready_w=os.pipe(); go_r,go_w=os.pipe()
          pid=os.fork()
          if pid==0:
              os.close(ready_r); os.close(go_w)
              if libc.unshare(flags)!=0:
                  os._exit(31)
              os.write(ready_w,b'R')
              if os.read(go_r,1)!=b'G': os._exit(32)
              with open('/proc/self/setgroups',encoding='utf-8') as f:
                  state=f.read().strip()
              before=os.getgroups()
              ctypes.set_errno(0)
              rc=libc.setgroups(0,None); err=ctypes.get_errno(); after=os.getgroups()
              print(f'child uid={os.getuid()} gid={os.getgid()} state={state} before={before} clear_rc={rc} errno={err} after={after}',flush=True)
              os._exit(0 if os.getuid()==0 and os.getgid()==0 and state=='allow' and rc==0 and not after else 33)
          os.close(ready_w); os.close(go_r)
          if os.read(ready_r,1)!=b'R':
              _,status=os.waitpid(pid,0); raise SystemExit(os.waitstatus_to_exitcode(status))
          u=subprocess.run(['newuidmap',str(pid),'0',str(uid),'1'],text=True,capture_output=True)
          g=subprocess.run(['newgidmap',str(pid),'0',str(gid),'1'],text=True,capture_output=True)
          print(f'newuidmap_rc={u.returncode} stderr={u.stderr.strip()!r}',flush=True)
          print(f'newgidmap_rc={g.returncode} stderr={g.stderr.strip()!r}',flush=True)
          if u.returncode or g.returncode:
              os.kill(pid,signal.SIGKILL); os.waitpid(pid,0); raise SystemExit(40)
          with open(f'/proc/{pid}/setgroups',encoding='utf-8') as f:
              state=f.read().strip()
          print(f'parent_setgroups_state={state}',flush=True)
          if state!='allow':
              os.kill(pid,signal.SIGKILL); os.waitpid(pid,0); raise SystemExit(41)
          os.write(go_w,b'G')
          _,status=os.waitpid(pid,0); code=os.waitstatus_to_exitcode(status)
          print(f'child_exit={code}',flush=True)
          if code: raise SystemExit(code)
          print('RESULT: one-entry newuidmap/newgidmap mapping preserves setgroups=allow and permits clearing supplementary groups.',flush=True)
          PY
