name: materialize milestone 31A claims

on:
  push:
    branches: [tmp-31a-claims-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          actual_sentence = "The tmpfs backing mount is `nosuid,nodev,noexec`; this is not a claim that the merged root is globally `noexec`."
          expected_sentence = "The COW backing tmpfs is `nosuid,nodev,noexec`, but the merged root is not claimed globally `noexec`."
          if text.count(actual_sentence) != 1:
              raise SystemExit(f"README actual COW backing sentence: expected one match, got {text.count(actual_sentence)}")
          text = text.replace(actual_sentence, expected_sentence, 1)
          cow_state = "- Copy-on-write root state is bounded to 4 KiB–1 GiB by policy, lives in a private tmpfs upper/work layer, and disappears with the sandbox mount namespace. Declared read-only persistent volumes are attached after final-root construction and remain read-only even when COW root is enabled; writable persistent volumes remain the separate explicit persistence authority."
          marker = "- **COW root evidence boundary:** the runtime receipt publishes exactly one of `readonly_root` or `copy_on_write_root` according to the requested final-root mode, and the receipt-completeness gate rejects the wrong or simultaneous mode. Static preflight leaves COW support `unprobed`; only a real run can produce positive enforcement evidence."
          if text.count(cow_state) != 1:
              raise SystemExit(f"README COW state invariant: expected one match, got {text.count(cow_state)}")
          text = text.replace(cow_state, cow_state + "\n" + marker, 1)
          p.write_text(text)
          PY
          python3 .github/tmp-31a-claims.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          text = p.read_text()
          marker = "- **COW root evidence boundary:** the runtime receipt publishes exactly one of `readonly_root` or `copy_on_write_root` according to the requested final-root mode, and the receipt-completeness gate rejects the wrong or simultaneous mode. Static preflight leaves COW support `unprobed`; only a real run can produce positive enforcement evidence.\n"
          if text.count(marker) != 1:
              raise SystemExit(f"README temporary COW evidence marker: expected one match, got {text.count(marker)}")
          p.write_text(text.replace(marker, "", 1))
          PY
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test stable
        run: cargo test --locked --all-targets --all-features
      - name: Test Rust 1.74
        run: |
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
          cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction files and commit claims tree
        run: |
          rm .github/tmp-31a-claims.py
          rm .github/workflows/tmp-31a-claims.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize milestone 31A claims"
          git push origin HEAD:tmp-31a-claims-generator
