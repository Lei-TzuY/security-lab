name: probe supplementary group mapping

on:
  push:
    branches: [tmp-supplementary-groups-probe]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable user namespace tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Inspect helper mapping environment
        run: |
          set -eux
          id
          id -G
          grep '^CapEff:' /proc/self/status
          command -v newgidmap
          command -v newuidmap
          grep -E '^(runner|1001):' /etc/subgid
          grep -E '^(runner|1001):' /etc/subuid
          ls -l /usr/bin/newgidmap /usr/bin/newuidmap
      - name: Prove self-mapping path cannot clear groups
        run: |
          cat > /tmp/self_group_probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <sched.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <unistd.h>

          static void write_file(const char *path, const char *data) {
              int fd = open(path, O_WRONLY | O_CLOEXEC);
              if (fd < 0) { perror(path); exit(10); }
              size_t len = strlen(data);
              if (write(fd, data, len) != (ssize_t)len) { perror("write"); exit(11); }
              close(fd);
          }

          int main(void) {
              uid_t uid = geteuid();
              gid_t gid = getegid();
              printf("before_unshare_groups=%d uid=%u gid=%u\n", getgroups(0, NULL), (unsigned)uid, (unsigned)gid);
              if (unshare(CLONE_NEWUSER) != 0) { perror("unshare userns"); return 20; }
              errno = 0;
              int rc_before = setgroups(0, NULL);
              printf("setgroups_before_gid_map_rc=%d errno=%d (%s)\n", rc_before, errno, strerror(errno));
              if (rc_before != -1 || errno != EPERM) return 21;
              char uid_map[64], gid_map[64];
              snprintf(uid_map, sizeof(uid_map), "0 %u 1\n", (unsigned)uid);
              snprintf(gid_map, sizeof(gid_map), "0 %u 1\n", (unsigned)gid);
              write_file("/proc/self/setgroups", "deny\n");
              write_file("/proc/self/uid_map", uid_map);
              write_file("/proc/self/gid_map", gid_map);
              errno = 0;
              int rc_after = setgroups(0, NULL);
              printf("setgroups_after_deny_and_gid_map_rc=%d errno=%d (%s)\n", rc_after, errno, strerror(errno));
              if (rc_after != -1 || errno != EPERM) return 22;
              puts("self_mapping_clear_blocker_confirmed");
              return 0;
          }
          EOF
          cc -Wall -Wextra -Werror -O2 /tmp/self_group_probe.c -o /tmp/self_group_probe
          /tmp/self_group_probe
      - name: Prove minimal parent-assisted mapping can clear groups
        run: |
          cat > /tmp/helper_group_probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <grp.h>
          #include <sched.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          static int run_helper(const char *helper, pid_t target, const char *outside0) {
              pid_t pid = fork();
              if (pid < 0) { perror("fork helper"); exit(30); }
              if (pid == 0) {
                  char target_s[32];
                  snprintf(target_s, sizeof(target_s), "%d", target);
                  execl(helper, helper, target_s, "0", outside0, "1", (char *)NULL);
                  perror(helper);
                  _exit(127);
              }
              int status = 0;
              if (waitpid(pid, &status, 0) != pid) { perror("waitpid helper"); exit(31); }
              return WIFEXITED(status) ? WEXITSTATUS(status) : 128;
          }

          int main(void) {
              uid_t uid = geteuid();
              gid_t gid = getegid();
              int ready[2], mapped[2];
              if (pipe(ready) || pipe(mapped)) { perror("pipe"); return 41; }
              pid_t child = fork();
              if (child < 0) { perror("fork child"); return 42; }
              if (child == 0) {
                  close(ready[0]); close(mapped[1]);
                  if (unshare(CLONE_NEWUSER) != 0) { perror("child unshare"); _exit(50); }
                  char one = 'R';
                  if (write(ready[1], &one, 1) != 1) _exit(51);
                  if (read(mapped[0], &one, 1) != 1) _exit(52);
                  FILE *f = fopen("/proc/self/setgroups", "re");
                  char state[32] = {0};
                  if (!f || !fgets(state, sizeof(state), f)) _exit(53);
                  if (f) fclose(f);
                  printf("child_setgroups_state=%s", state);
                  errno = 0;
                  int rc = setgroups(0, NULL);
                  int remaining = getgroups(0, NULL);
                  printf("child_setgroups_clear_rc=%d errno=%d (%s) remaining=%d euid=%u egid=%u\n",
                         rc, errno, strerror(errno), remaining,
                         (unsigned)geteuid(), (unsigned)getegid());
                  fflush(stdout);
                  if (rc != 0 || remaining != 0 || geteuid() != 0 || getegid() != 0) _exit(54);
                  _exit(0);
              }
              close(ready[1]); close(mapped[0]);
              char one;
              if (read(ready[0], &one, 1) != 1) return 60;
              char uid_s[32], gid_s[32];
              snprintf(uid_s, sizeof(uid_s), "%u", (unsigned)uid);
              snprintf(gid_s, sizeof(gid_s), "%u", (unsigned)gid);
              int uid_rc = run_helper("/usr/bin/newuidmap", child, uid_s);
              int gid_rc = run_helper("/usr/bin/newgidmap", child, gid_s);
              printf("minimal_newuidmap_rc=%d minimal_newgidmap_rc=%d child=%d\n", uid_rc, gid_rc, child);
              fflush(stdout);
              if (uid_rc != 0 || gid_rc != 0) { kill(child, SIGKILL); waitpid(child, NULL, 0); return 61; }
              one = 'M';
              if (write(mapped[1], &one, 1) != 1) return 62;
              int status = 0;
              if (waitpid(child, &status, 0) != child) return 63;
              if (!WIFEXITED(status) || WEXITSTATUS(status) != 0) return 64;
              puts("minimal_parent_assisted_group_clear_confirmed");
              return 0;
          }
          EOF
          cc -Wall -Wextra -Werror -O2 /tmp/helper_group_probe.c -o /tmp/helper_group_probe
          /tmp/helper_group_probe
