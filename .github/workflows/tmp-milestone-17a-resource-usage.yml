name: materialize milestone 17A resource usage

on:
  push:
    branches: [tmp-17a-resource-usage-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: |
          python3 .github/tmp-milestone-17a-resource-usage.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/cli.rs")
          text = path.read_text()
          old = '''    assert_eq!(
                  String::from_utf8(output.stdout).expect("JSON CLI stdout is UTF-8"),
                  "{\\\"ok\\\":true,\\\"outcome\\\":{\\\"kind\\\":\\\"exited\\\",\\\"code\\\":0},\\\"stdout\\\":{\\\"encoding\\\":\\\"hex\\\",\\\"data\\\":\\\"68656c6c6f2066726f6d2073656375726974792d6c61620a\\\",\\\"truncated\\\":false},\\\"reaped_descendants\\\":0}\\n"
              );'''
          new = '''    let stdout = String::from_utf8(output.stdout).expect("JSON CLI stdout is UTF-8");
              let prefix = "{\\\"ok\\\":true,\\\"outcome\\\":{\\\"kind\\\":\\\"exited\\\",\\\"code\\\":0},\\\"stdout\\\":{\\\"encoding\\\":\\\"hex\\\",\\\"data\\\":\\\"68656c6c6f2066726f6d2073656375726974792d6c61620a\\\",\\\"truncated\\\":false},\\\"reaped_descendants\\\":0,\\\"process_tree_usage\\\":{\\\"user_cpu_micros\\\":";
              let usage = stdout
                  .strip_prefix(prefix)
                  .unwrap_or_else(|| panic!("unexpected deterministic JSON prefix: {stdout}"));
              let (user_cpu, usage) = usage
                  .split_once(",\\\"system_cpu_micros\\\":")
                  .unwrap_or_else(|| panic!("missing system CPU telemetry: {stdout}"));
              let (system_cpu, usage) = usage
                  .split_once(",\\\"max_child_rss_kib\\\":")
                  .unwrap_or_else(|| panic!("missing RSS telemetry: {stdout}"));
              let max_rss = usage
                  .strip_suffix("}}\\n")
                  .unwrap_or_else(|| panic!("unexpected JSON telemetry suffix: {stdout}"));
              for (label, value) in [
                  ("user_cpu_micros", user_cpu),
                  ("system_cpu_micros", system_cpu),
                  ("max_child_rss_kib", max_rss),
              ] {
                  assert!(
                      !value.is_empty() && value.bytes().all(|byte| byte.is_ascii_digit()),
                      "{label} must be an unsigned decimal integer, got {value:?} in {stdout}"
                  );
              }'''
          if text.count(old) != 1:
              raise SystemExit(f"CLI JSON contract replacement expected one match, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-17a-resource-usage.py
          rm .github/workflows/tmp-milestone-17a-resource-usage.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: report process-tree resource usage"
          git push origin HEAD:tmp-17a-resource-usage-generator
