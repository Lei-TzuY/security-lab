name: materialize milestone 13A Landlock signal scope

on:
  push:
    branches: [tmp-13a-landlock-signal-generator]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-13a-landlock-signal.py
      - name: Instrument unscoped errno
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fixtures/probe.S')
          text = p.read_text()
          old = '''.pidfd_signal_allowed:
              mov $424, %eax
              mov $9, %edi
              mov $10, %esi
              xor %edx, %edx
              xor %r10d, %r10d
              syscall
              test %rax, %rax
              js .fail41
              xor %edi, %edi
              jmp .exit
          '''
          new = '''.pidfd_signal_allowed:
              mov $424, %eax
              mov $9, %edi
              mov $10, %esi
              xor %edx, %edx
              xor %r10d, %r10d
              syscall
              test %rax, %rax
              jns .pidfd_signal_allowed_ok
              neg %eax
              mov %eax, %edi
              jmp .exit
          .pidfd_signal_allowed_ok:
              xor %edi, %edi
              jmp .exit
          '''
          if text.count(old) != 1:
              raise SystemExit(f'unscoped oracle block matches={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Focused oracle
        run: cargo test --locked --test sandbox selected_pidfd_signal_authority_is_attenuated_by_landlock_scope -- --exact --nocapture
