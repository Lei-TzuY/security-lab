name: construct milestone 3A candidate

on:
  push:
    branches: ["tmp-3a-generator"]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: tmp-3a-generator
      - name: Materialize candidate
        run: python3 tools/tmp_milestone_3a_generator.py
      - name: Remove construction files and commit candidate tree
        shell: bash
        run: |
          rm tools/tmp_milestone_3a_generator.py
          rm .github/workflows/tmp-milestone-3a-generator.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add PID namespace process-tree lifecycle"
          git push origin HEAD:tmp-3a-generator
