name: verify ingress port race fix

on:
  push:
    branches: [tmp-14a-ingress-port-race-fix]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize fix
        run: python3 .github/tmp-ingress-port-race-fix.py
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Stable full tests
        run: cargo test --locked --all-targets --all-features
      - name: Install MSRV
        run: rustup toolchain install 1.74.0 --profile minimal
      - name: Rust 1.74 full tests
        run: cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-ingress-port-race-fix.py
          rm .github/workflows/tmp-ingress-port-race-fix.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "test: harden brokered ingress port acquisition"
          git push origin HEAD:tmp-14a-ingress-port-race-fix
