name: probe bounded private overlayfs capability

on:
  push:
    branches: [tmp-27a-overlayfs-capability-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable unprivileged user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Probe bounded private copy-on-write root semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v unshare
          command -v mount

          base="$(mktemp -d /tmp/security-lab-overlay-probe.XXXXXX)"
          mkdir -p "$base/lower/dir" "$base/state" "$base/merged"
          printf 'lower-original\n' > "$base/lower/base"
          printf 'lower-child\n' > "$base/lower/dir/child"
          lower_base_hash="$(sha256sum "$base/lower/base" | awk '{print $1}')"
          lower_child_hash="$(sha256sum "$base/lower/dir/child" | awk '{print $1}')"
          export base

          unshare --user --map-root-user --mount -- bash -c '
            set -euo pipefail
            mount --make-rprivate /
            mount -t tmpfs -o size=16777216,mode=0700,nosuid,nodev,noexec tmpfs "$base/state"
            mkdir "$base/state/upper" "$base/state/work"
            mount -t overlay overlay \
              -o "lowerdir=$base/lower,upperdir=$base/state/upper,workdir=$base/state/work" \
              "$base/merged"

            test "$(cat "$base/merged/base")" = "lower-original"
            test "$(cat "$base/merged/dir/child")" = "lower-child"

            printf "overlay-replaced\n" > "$base/merged/base"
            printf "overlay-new\n" > "$base/merged/new"
            mkdir "$base/merged/newdir"
            printf "overlay-nested\n" > "$base/merged/newdir/item"
            mv "$base/merged/newdir/item" "$base/merged/newdir/renamed"
            rm "$base/merged/dir/child"

            test "$(cat "$base/merged/base")" = "overlay-replaced"
            test "$(cat "$base/merged/new")" = "overlay-new"
            test "$(cat "$base/merged/newdir/renamed")" = "overlay-nested"
            test ! -e "$base/merged/dir/child"
            test "$(cat "$base/state/upper/base")" = "overlay-replaced"
            test "$(cat "$base/state/upper/new")" = "overlay-new"
            test "$(cat "$base/state/upper/newdir/renamed")" = "overlay-nested"

            umount "$base/merged"
            umount "$base/state"
          '

          test "$(sha256sum "$base/lower/base" | awk '{print $1}')" = "$lower_base_hash"
          test "$(sha256sum "$base/lower/dir/child" | awk '{print $1}')" = "$lower_child_hash"
          test "$(cat "$base/lower/base")" = "lower-original"
          test "$(cat "$base/lower/dir/child")" = "lower-child"
          test ! -e "$base/lower/new"
          test -z "$(find "$base/state" -mindepth 1 -print -quit)"
          test -z "$(find "$base/merged" -mindepth 1 -print -quit)"
          rm -rf "$base"

          echo "RESULT: unprivileged OverlayFS with namespace-private bounded tmpfs upper/work supports copy-up, create, rename, delete/whiteout semantics while leaving the lower tree unchanged."
      - name: Remove probe workflow
        if: always()
        run: |
          rm .github/workflows/tmp-27a-overlayfs-capability-probe.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "chore: clean bounded overlayfs capability probe" || exit 0
          git push origin HEAD:tmp-27a-overlayfs-capability-probe
