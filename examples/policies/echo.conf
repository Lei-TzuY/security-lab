# Example for a dynamically linked /bin/echo on typical x86_64 glibc Linux.
# Exact loader syscall needs can vary by distribution; failure is intentional if
# this allowlist is too narrow for the local binary.
executable = /bin/echo
arg = hello from security-lab
working_dir = /tmp
env.LANG = C
limit.cpu_seconds = 2
limit.address_space_bytes = 536870912
limit.file_size_bytes = 1048576
limit.open_files = 32
seccomp.allow = execve,read,write,close,fstat,lseek,mmap,mprotect,munmap,brk,rt_sigaction,rt_sigprocmask,rt_sigreturn,ioctl,pread64,access,mremap,madvise,sched_yield,nanosleep,getuid,getgid,geteuid,getegid,fcntl,getcwd,readlink,sigaltstack,arch_prctl,futex,sched_getaffinity,set_tid_address,exit,openat,newfstatat,set_robust_list,prlimit64,getrandom,exit_group,statx,rseq,clock_gettime,uname,readlinkat
