              '''#[repr(C, align(8))]
          struct OneFdControl([u8; 24]);

          unsafe fn read_exact_byte(fd: libc::c_int) -> Result<u8, i32> {
              let mut byte = 0u8;
              loop {
                  let read = libc::read(
                      fd,
                      (&mut byte as *mut u8).cast::<libc::c_void>(),
                      1,
                  );
                  if read == 1 {
                      return Ok(byte);
                  }
                  if read == 0 {
                      return Err(libc::EPIPE);
                  }
                  if read == -1 {
                      let errno = *libc::__errno_location();
                      if errno == libc::EINTR {
                          continue;
                      }
                      return Err(errno);
                  }
                  return Err(libc::EPROTO);
              }
          }

          unsafe fn write_exact_byte(fd: libc::c_int, byte: u8) -> Result<(), i32> {
              loop {
                  let written = libc::send(
                      fd,
                      (&byte as *const u8).cast::<libc::c_void>(),
                      1,
                      libc::MSG_NOSIGNAL,
                  );
                  if written == 1 {
                      return Ok(());
                  }
                  if written == -1 {
                      let errno = *libc::__errno_location();
                      if errno == libc::EINTR {
                          continue;
                      }
                      return Err(errno);
                  }
                  return Err(libc::EPIPE);
              }
          }

          unsafe fn receive_one_readonly_regular_fd(socket_fd: libc::c_int) -> Result<libc::c_int, i32> {
              let mut payload = 0u8;
              let mut iov = libc::iovec {
                  iov_base: (&mut payload as *mut u8).cast::<libc::c_void>(),
                  iov_len: 1,
              };
              let mut control = OneFdControl([0u8; 24]);
              let mut message = std::mem::zeroed::<libc::msghdr>();
              message.msg_iov = &mut iov;
              message.msg_iovlen = 1;
              message.msg_control = control.0.as_mut_ptr().cast::<libc::c_void>();
              message.msg_controllen = control.0.len();
              loop {
                  let received = libc::recvmsg(socket_fd, &mut message, libc::MSG_CMSG_CLOEXEC);
                  if received == 1 {
                      break;
                  }
                  if received == 0 {
                      return Err(libc::EPIPE);
                  }
                  if received == -1 {
                      let errno = *libc::__errno_location();
                      if errno == libc::EINTR {
                          continue;
                      }
                      return Err(errno);
                  }
                  return Err(libc::EPROTO);
              }
              if payload != b'F'
                  || message.msg_flags & (libc::MSG_CTRUNC | libc::MSG_TRUNC) != 0
                  || message.msg_controllen != 24
              {
                  return Err(libc::EPROTO);
              }
              let header = control.0.as_ptr().cast::<libc::cmsghdr>();
              if (*header).cmsg_len != 20
                  || (*header).cmsg_level != libc::SOL_SOCKET
                  || (*header).cmsg_type != libc::SCM_RIGHTS
              {
                  return Err(libc::EPROTO);
              }
              let received_fd = control.0.as_ptr().add(16).cast::<libc::c_int>().read();
              if received_fd < 0 {
                  return Err(libc::EBADF);
              }
              let mut stat = std::mem::zeroed::<libc::stat>();
              if libc::fstat(received_fd, &mut stat) == -1 {
                  let errno = *libc::__errno_location();
                  libc::close(received_fd);
                  return Err(errno);
              }
              if stat.st_mode & libc::S_IFMT != libc::S_IFREG {
                  libc::close(received_fd);
                  return Err(libc::EPERM);
              }
              let flags = libc::fcntl(received_fd, libc::F_GETFL);
              if flags == -1 {
                  let errno = *libc::__errno_location();
                  libc::close(received_fd);
                  return Err(errno);
              }
              if flags & libc::O_ACCMODE != libc::O_RDONLY {
                  libc::close(received_fd);
                  return Err(libc::EACCES);
              }
              Ok(received_fd)
          }

          unsafe fn send_one_fd(socket_fd: libc::c_int, source_fd: libc::c_int) -> Result<(), i32> {
              let payload = b'F';
              let mut iov = libc::iovec {
                  iov_base: (&payload as *const u8).cast::<libc::c_void>() as *mut libc::c_void,
                  iov_len: 1,
