name: materialize runtime FD rights sync

on:
  push:
    branches: [tmp-runtime-fd-rights-sync]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize current-main integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin milestone-runtime-fd-rights
          git show origin/milestone-runtime-fd-rights:src/runtime_fd_broker.rs > src/runtime_fd_broker.rs
          git show origin/milestone-runtime-fd-rights:tests/runtime_fd_broker.rs > tests/runtime_fd_broker.rs
          python3 - <<'PY'
          from pathlib import Path

          tests = Path("tests/runtime_fd_broker.rs")
          text = tests.read_text()
          needle = "use std::io::Write;\n"
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one stale std::io::Write import")
          tests.write_text(text.replace(needle, "", 1))

          lib = Path("src/lib.rs")
          text = lib.read_text()
          if "mod runtime_fd_broker;" in text or "pub use runtime_fd_broker::" in text:
              raise SystemExit("runtime FD broker already integrated into current main")
          module_anchor = "pub mod report;\n"
          if text.count(module_anchor) != 1:
              raise SystemExit("unexpected lib.rs module layout")
          text = text.replace(module_anchor, module_anchor + "mod runtime_fd_broker;\n", 1)
          export_anchor = "pub use snapshot_auth::{\n"
          if text.count(export_anchor) != 1:
              raise SystemExit("unexpected lib.rs export layout")
          export = (
              "pub use runtime_fd_broker::{\n"
              "    PreparedReadOnlyRegularFile, RuntimeFdBroker, RuntimeFdBrokerError, RuntimeFdSession,\n"
              "};\n"
          )
          text = text.replace(export_anchor, export + export_anchor, 1)
          lib.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction workflow and commit resolved tree
        run: |
          rm .github/workflows/tmp-runtime-fd-rights-sync.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: integrate runtime FD rights mediator"
          git push origin HEAD:tmp-runtime-fd-rights-sync
