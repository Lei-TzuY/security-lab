name: format milestone 3A candidate

on:
  push:
    branches: ["tmp-3a-generator"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: tmp-3a-generator
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove formatter workflow and commit formatted tree
        shell: bash
        run: |
          rm .github/workflows/tmp-milestone-3a-format.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "style: format PID lifecycle implementation"
          git push origin HEAD:tmp-3a-generator
