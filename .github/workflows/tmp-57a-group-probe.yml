name: probe supplementary group prerequisites

on:
  push:
    branches: [tmp-57a-group-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Probe helper-owned mappings and group clear
        run: |
          set -eux
          uid="$(id -u)"
          gid="$(id -g)"
          subuid="$(awk -F: -v u="$(id -un)" '$1 == u { print $2; exit }' /etc/subuid)"
          subgid="$(awk -F: -v u="$(id -un)" '$1 == u { print $2; exit }' /etc/subgid)"
          test -n "$subuid"
          test -n "$subgid"
          cat >/tmp/group-map-probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <grp.h>
          #include <sched.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          static void die(const char *what) {
              fprintf(stderr, "%s: %s\n", what, strerror(errno));
              exit(1);
          }

          static int run_gid_map(pid_t pid, const char *host_gid) {
              char pid_text[32];
              snprintf(pid_text, sizeof(pid_text), "%ld", (long)pid);
              pid_t helper = fork();
              if (helper < 0) die("fork helper");
              if (helper == 0) {
                  execlp("newgidmap", "newgidmap", pid_text, "0", host_gid, "1", (char *)0);
                  die("exec newgidmap");
              }
              int status = 0;
              if (waitpid(helper, &status, 0) < 0) die("wait newgidmap");
              return WIFEXITED(status) ? WEXITSTATUS(status) : 255;
          }

          static void write_uid_map(const char *host_uid) {
              char map[64];
              int len = snprintf(map, sizeof(map), "0 %s 1\n", host_uid);
              if (len <= 0 || (size_t)len >= sizeof(map)) die("format uid_map");
              int fd = open("/proc/self/uid_map", O_WRONLY | O_CLOEXEC);
              if (fd < 0) die("open uid_map");
              if (write(fd, map, (size_t)len) != len) die("write uid_map");
              close(fd);
          }

          int main(int argc, char **argv) {
              if (argc != 5) return 2;
              int ready[2], go[2];
              if (pipe2(ready, O_CLOEXEC) || pipe2(go, O_CLOEXEC)) die("pipe2");
              pid_t child = fork();
              if (child < 0) die("fork child");
              if (child == 0) {
                  close(ready[0]);
                  close(go[1]);
                  if (unshare(CLONE_NEWUSER) != 0) die("unshare");
                  write_uid_map(argv[1]);
                  if (write(ready[1], "R", 1) != 1) die("ready write");
                  char byte;
                  if (read(go[0], &byte, 1) != 1) die("go read");

                  char buf[32] = {0};
                  int fd = open("/proc/self/setgroups", O_RDONLY | O_CLOEXEC);
                  if (fd < 0) die("open setgroups");
                  ssize_t n = read(fd, buf, sizeof(buf) - 1);
                  if (n < 0) die("read setgroups");
                  close(fd);
                  printf("setgroups-state=%s", buf);

                  errno = 0;
                  int clear_rc = setgroups(0, NULL);
                  int clear_errno = errno;
                  errno = 0;
                  int count = getgroups(0, NULL);
                  int count_errno = errno;
                  printf("clear_rc=%d clear_errno=%d groups_after=%d groups_errno=%d\n",
                         clear_rc, clear_errno, count, count_errno);
                  fflush(stdout);
                  _exit(clear_rc == 0 && count == 0 ? 0 : 3);
              }

              close(ready[1]);
              close(go[0]);
              char byte;
              if (read(ready[0], &byte, 1) != 1) die("ready read");
              int grc = run_gid_map(child, argv[2]);
              printf("newgidmap_rc=%d\n", grc);
              fflush(stdout);
              if (grc != 0) {
                  kill(child, SIGKILL);
                  waitpid(child, NULL, 0);
                  return 4;
              }
              if (write(go[1], "G", 1) != 1) die("go write");
              int status = 0;
              if (waitpid(child, &status, 0) < 0) die("wait child");
              if (!WIFEXITED(status)) return 5;
              return WEXITSTATUS(status);
          }
          EOF
          cc -Wall -Wextra -Werror /tmp/group-map-probe.c -o /tmp/group-map-probe
          /tmp/group-map-probe "$uid" "$gid" "$subuid" "$subgid"
