name: probe supplementary group mapping

on:
  push:
    branches: [tmp-supplementary-groups-probe]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable user namespace tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Inspect environment
        run: |
          set -eux
          id
          grep '^CapEff:' /proc/self/status
          command -v newgidmap
          command -v newuidmap
          grep -E '^(runner|1001):' /etc/subgid
          ls -l /usr/bin/newgidmap /usr/bin/newuidmap
      - name: Prove minimal assisted map shape
        run: |
          SUBGID_START=$(awk -F: '$1=="runner" {print $2; exit}' /etc/subgid)
          cat > /tmp/helper_group_probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <grp.h>
          #include <sched.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <unistd.h>

          static int uid_helper(pid_t target, uid_t uid) {
              pid_t p=fork(); if(p==0){char t[32],u[32];snprintf(t,sizeof(t),"%d",target);snprintf(u,sizeof(u),"%u",(unsigned)uid);execl("/usr/bin/newuidmap","newuidmap",t,"0",u,"1",(char*)NULL);_exit(127);} int s; waitpid(p,&s,0); return WIFEXITED(s)?WEXITSTATUS(s):128;
          }
          static int gid_helper(pid_t target, gid_t gid, const char *subgid) {
              pid_t p=fork(); if(p==0){char t[32],g[32];snprintf(t,sizeof(t),"%d",target);snprintf(g,sizeof(g),"%u",(unsigned)gid);execl("/usr/bin/newgidmap","newgidmap",t,"0",g,"1","1",subgid,"1",(char*)NULL);_exit(127);} int s; waitpid(p,&s,0); return WIFEXITED(s)?WEXITSTATUS(s):128;
          }
          int main(int argc,char**argv){if(argc!=2)return 40;uid_t uid=geteuid();gid_t gid=getegid();int a[2],b[2];if(pipe(a)||pipe(b))return 41;pid_t c=fork();if(c==0){close(a[0]);close(b[1]);if(unshare(CLONE_NEWUSER))_exit(50);char x='R';if(write(a[1],&x,1)!=1)_exit(51);if(read(b[0],&x,1)!=1)_exit(52);FILE*f=fopen("/proc/self/setgroups","re");char st[32]={0};if(!f||!fgets(st,sizeof(st),f))_exit(53);if(f)fclose(f);errno=0;int rc=setgroups(0,NULL);int n=getgroups(0,NULL);printf("setgroups_state=%schild_clear_rc=%d errno=%d remaining=%d euid=%u egid=%u\n",st,rc,errno,n,(unsigned)geteuid(),(unsigned)getegid());fflush(stdout);_exit(rc==0&&n==0&&geteuid()==0&&getegid()==0?0:54);}close(a[1]);close(b[0]);char x;if(read(a[0],&x,1)!=1)return 60;int ur=uid_helper(c,uid);int gr=gid_helper(c,gid,argv[1]);printf("uid_helper_rc=%d gid_helper_rc=%d\n",ur,gr);fflush(stdout);if(ur||gr){kill(c,SIGKILL);waitpid(c,NULL,0);return 61;}x='M';if(write(b[1],&x,1)!=1)return 62;int s;if(waitpid(c,&s,0)!=c)return 63;if(!WIFEXITED(s)||WEXITSTATUS(s)!=0)return 64;puts("minimal_gid_assisted_group_clear_confirmed");return 0;}
          EOF
          cc -Wall -Wextra -Werror -O2 /tmp/helper_group_probe.c -o /tmp/helper_group_probe
          /tmp/helper_group_probe "$SUBGID_START"
