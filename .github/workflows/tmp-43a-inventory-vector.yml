name: probe milestone 43A inventory vector

on:
  push:
    branches: [tmp-43a-inventory-vector]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Print canonical inventory vector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/snapshot_store_inventory.rs')
          text = p.read_text()
          needle = '    assert_eq!(identity_a, identity_b);\n'
          replacement = needle + '    println!("INVENTORY_VECTOR={} objects={} bytes={}", identity_a.sha256_hex(), identity_a.objects, identity_a.archive_bytes);\n'
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one inventory equality anchor')
          p.write_text(text.replace(needle, replacement, 1))
          PY
          cargo test --locked --test snapshot_store_inventory inventory_identity_is_repeatable_and_creation_order_independent -- --nocapture
