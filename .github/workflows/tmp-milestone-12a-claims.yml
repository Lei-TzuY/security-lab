name: materialize milestone 12A Landlock TCP claims

on:
  push:
    branches: [tmp-12a-landlock-tcp-claims]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Align current README evidence anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp-milestone-12a-claims.py')
          text = p.read_text()
          old = '    "- a host `127.0.0.1` TCP listener is first proven reachable from the host process,",'
          new = '    "- separately, a host `127.0.0.1` TCP listener is first proven reachable from the host process,",'
          if text.count(old) != 1:
              raise SystemExit(f'README evidence anchor patch expected one match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Materialize claims
        run: python3 .github/tmp-milestone-12a-claims.py
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit claims tree
        run: |
          rm .github/tmp-milestone-12a-claims.py
          rm .github/workflows/tmp-milestone-12a-claims.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize milestone 12A claims"
          git push origin HEAD:tmp-12a-landlock-tcp-claims
