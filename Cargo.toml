[package]
name = "security-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Correctness-first systems security laboratory"
license = "MIT"

[dependencies]
ed25519-dalek = "=2.1.1"
hmac = "=0.12.1"
libc = "0.2"
sha2 = "=0.10.9"

[[bin]]
name = "security-lab"
path = "src/main.rs"

[[bin]]
name = "security-lab-authority-delta"
path = "src/authority_delta_main.rs"

[[bin]]
name = "security-lab-runtime-receipt-gate"
path = "src/runtime_receipt_gate_main.rs"

[[bin]]
name = "security-lab-snapshot-publish"
path = "src/snapshot_publish_main.rs"
