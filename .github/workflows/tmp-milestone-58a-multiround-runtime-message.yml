name: materialize milestone 58A multi-round runtime messages

on:
  push:
    branches: [tmp-58a-multiround-runtime-message]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-58a-multiround-runtime-message.py
      - name: Format
        run: cargo fmt --all
      - name: Focused runtime broker tests
        run: cargo test --locked --test runtime_fd_broker
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Full test suite
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-58a-multiround-runtime-message.py
          rm .github/workflows/tmp-milestone-58a-multiround-runtime-message.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add bounded multi-round runtime messages"
          git push origin HEAD:tmp-58a-multiround-runtime-message
