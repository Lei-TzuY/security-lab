# Mechanism demonstration for a dynamically linked /usr/bin/echo on a typical
# x86_64 glibc Linux system. filesystem.root=/ intentionally exposes the host
# root pathname namespace, but Milestone 2D presents it to the target through a
# private recursively read-only mount tree. Construct a smaller root for real
# path minimization.
#
# To grant one writable ephemeral location, ensure the directory already exists
# inside filesystem.root and uncomment a bounded private tmpfs declaration such
# as the pair below. The scratch mount is nosuid,nodev,noexec and does not write
# through to the corresponding host directory.
# filesystem.scratch = /var/tmp
# filesystem.scratch_bytes = 16777216
#
# Exact loader syscall needs vary by distribution, so an insufficient allowlist
# is expected to fail rather than silently widen itself.
filesystem.root = /
executable = /usr/bin/echo
arg = hello from security-lab
working_dir = /tmp
env.LANG = C
limit.cpu_seconds = 2
limit.address_space_bytes = 536870912
limit.file_size_bytes = 1048576
limit.open_files = 32
seccomp.allow = execveat,read,write,close,fstat,lseek,mmap,mprotect,munmap,brk,rt_sigaction,rt_sigprocmask,rt_sigreturn,ioctl,pread64,access,mremap,madvise,sched_yield,nanosleep,getuid,getgid,geteuid,getegid,fcntl,getcwd,readlink,sigaltstack,arch_prctl,futex,sched_getaffinity,set_tid_address,exit,openat,newfstatat,set_robust_list,prlimit64,getrandom,exit_group,statx,rseq,clock_gettime,uname,readlinkat
