name: materialize milestone 31A permission metadata fix

on:
  push:
    branches: [tmp-31a-cow-diff-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize permission metadata fix
        run: |
          python3 .github/tmp-31a-mode-metadata-fix.py
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  "src/platform/linux_cow_diff.rs",
                  "        | CowDiffEntry::EnsureDirectory { path }\n",
                  "        | CowDiffEntry::EnsureDirectory { path, .. }\n",
                  "entry_path EnsureDirectory pattern",
              ),
              (
                  "src/cli_json.rs",
                  "        CowDiffEntry::EnsureDirectory { path } => (\"ensure_directory\", path),\n",
                  "        CowDiffEntry::EnsureDirectory { path, .. } => (\"ensure_directory\", path),\n",
                  "CLI EnsureDirectory kind pattern",
              ),
          ]
          for path, old, new, label in replacements:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test stable
        run: cargo test --locked --all-targets --all-features
      - name: Test Rust 1.74
        run: |
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
          cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-31a-mode-metadata-fix.py
          rm .github/workflows/tmp-31a-mode-metadata-fix.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "fix: preserve COW diff permission modes"
          git push origin HEAD:tmp-31a-cow-diff-generator
