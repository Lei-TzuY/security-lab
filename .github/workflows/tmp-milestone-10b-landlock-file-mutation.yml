name: materialize milestone 10B Landlock file mutation

on:
  push:
    branches: [tmp-10b-landlock-file-mutation-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-10b-landlock-file-mutation.py
      - name: Normalize MSRV-safe expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/policy.rs")
          text = p.read_text()
          text, scratch_count = re.subn(
              r"let in_scratch = self\s*\.scratch_dir\s*\.as_ref\(\)\s*\.map_or\(false, \|scratch\| path == scratch\);",
              "let in_scratch = self.scratch_dir.as_ref() == Some(path);",
              text,
          )
          text, volume_count = re.subn(
              r"let in_writable_volume = self\s*\.writable_volume_target\s*\.as_ref\(\)\s*\.map_or\(false, \|target\| path\.starts_with\(target\)\);",
              "let in_writable_volume = self.writable_volume_target.as_ref().is_some_and(|target| path.starts_with(target));",
              text,
          )
          if scratch_count != 1 or volume_count != 1:
              raise SystemExit(
                  f"MSRV-safe normalization expected one match each, got scratch={scratch_count}, volume={volume_count}"
              )
          p.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Stable full tests
        run: cargo test --locked --all-targets --all-features
      - name: Install declared minimum Rust version
        run: rustup toolchain install 1.74.0 --profile minimal --no-self-update
      - name: Rust 1.74 full tests
        run: cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-10b-landlock-file-mutation.py
          rm .github/workflows/tmp-milestone-10b-landlock-file-mutation.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add Landlock file mutation envelope"
          git push origin HEAD:tmp-10b-landlock-file-mutation-generator
