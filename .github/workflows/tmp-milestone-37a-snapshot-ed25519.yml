name: materialize milestone 37A snapshot Ed25519

on:
  push:
    branches: [tmp-37a-snapshot-ed25519-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-37a-snapshot-ed25519.py
      - name: Resolve lockfile
        run: cargo check --all-targets --all-features
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test stable
        run: cargo test --locked --all-targets --all-features
      - name: Install Rust 1.74
        run: rustup toolchain install 1.74.0 --profile minimal
      - name: Test declared minimum Rust version
        run: cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-37a-snapshot-ed25519.py
          rm .github/workflows/tmp-milestone-37a-snapshot-ed25519.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add Ed25519 snapshot signatures"
          git push origin HEAD:tmp-37a-snapshot-ed25519-generator
