name: probe private routed network peer

on:
  push:
    branches: [tmp-routed-private-peer-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable unprivileged user namespace tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Probe nested owned netns veth routing without host network privilege
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          command -v ip
          command -v nsenter

          host_uid="$(id -u)"
          host_net="$(readlink /proc/self/ns/net)"
          echo "host uid=${host_uid} netns=${host_net}"
          grep '^CapEff:' /proc/self/status
          test "${host_uid}" -ne 0
          export HOST_NET="${host_net}"

          unshare --user --map-root-user --net -- bash <<'INNER'
          set -euo pipefail
          outer_net="$(readlink /proc/self/ns/net)"
          echo "owned outer netns=${outer_net} uid=$(id -u)"
          grep '^CapEff:' /proc/self/status
          test "${outer_net}" != "${HOST_NET}"

          unshare --net -- bash -c 'exec sleep 30' &
          peer_pid=$!
          server_pid=''
          cleanup() {
            if [ -n "${server_pid}" ]; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            kill "${peer_pid}" 2>/dev/null || true
            wait "${peer_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 50); do
            if [ -e "/proc/${peer_pid}/ns/net" ]; then
              peer_net="$(readlink "/proc/${peer_pid}/ns/net")"
              if [ "${peer_net}" != "${outer_net}" ]; then
                break
              fi
            fi
            sleep 0.02
          done
          peer_net="$(readlink "/proc/${peer_pid}/ns/net")"
          echo "owned peer netns=${peer_net} pid=${peer_pid}"
          test "${peer_net}" != "${outer_net}"
          test "${peer_net}" != "${HOST_NET}"

          ip link add slrt0 type veth peer name slrp0
          ip link set slrp0 netns "${peer_pid}"
          ip addr add 10.203.0.1/30 dev slrt0
          ip link set slrt0 up
          nsenter -t "${peer_pid}" -n ip link set lo up
          nsenter -t "${peer_pid}" -n ip addr add 10.203.0.2/30 dev slrp0
          nsenter -t "${peer_pid}" -n ip link set slrp0 up

          echo 'outer routes:'
          ip -4 route show
          echo 'peer routes:'
          nsenter -t "${peer_pid}" -n ip -4 route show
          test -z "$(ip -4 route show default)"
          test -z "$(nsenter -t "${peer_pid}" -n ip -4 route show default)"

          cat >/tmp/security-lab-private-peer-server.py <<'PY'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("10.203.0.2", 32123))
          s.listen(1)
          conn, _ = s.accept()
          data = conn.recv(64)
          if data != b"route-probe":
              raise SystemExit(f"unexpected payload: {data!r}")
          conn.sendall(b"peer-ok")
          conn.close()
          s.close()
          PY
          nsenter -t "${peer_pid}" -n python3 /tmp/security-lab-private-peer-server.py &
          server_pid=$!

          python3 - <<'PY'
          import socket, time
          last = None
          for _ in range(50):
              try:
                  s = socket.create_connection(("10.203.0.2", 32123), timeout=0.2)
                  break
              except OSError as exc:
                  last = exc
                  time.sleep(0.02)
          else:
              raise SystemExit(f"private peer connect failed: {last}")
          s.sendall(b"route-probe")
          data = s.recv(64)
          if data != b"peer-ok":
              raise SystemExit(f"unexpected private peer reply: {data!r}")
          s.close()
          PY
          wait "${server_pid}"
          server_pid=''

          python3 - <<'PY'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.settimeout(0.2)
          rc = s.connect_ex(("192.0.2.1", 9))
          s.close()
          if rc == 0:
              raise SystemExit("unexpected undeclared external route")
          print(f"undeclared external connect rejected rc={rc}")
          PY

          echo 'RESULT: two network namespaces owned by one unprivileged user namespace can form a veth-routed private IPv4 link with positive TCP, while no default/external route exists.'
          INNER

          test "$(readlink /proc/self/ns/net)" = "${host_net}"
          if ip link show slrt0 >/dev/null 2>&1 || ip link show slrp0 >/dev/null 2>&1; then
            echo 'private veth leaked into host netns' >&2
            exit 31
          fi

      - name: Clean probe workflow
        shell: bash
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          rm .github/workflows/tmp-routed-private-peer-probe.yml
          git add -A
          git commit -m 'chore: clean private routed peer probe'
          git push origin HEAD:tmp-routed-private-peer-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
