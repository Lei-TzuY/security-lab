name: materialize milestone 12A Landlock TCP ports

on:
  push:
    branches: [tmp-12a-landlock-tcp-ports]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Repair staged test separators
        run: python3 .github/tmp-milestone-12a-test-string-fix.py
      - name: Stage policy acceptance test first
        run: python3 .github/tmp-milestone-12a.py tests
      - name: Prove the new policy spec is red before implementation
        run: |
          set +e
          cargo test --locked policy::tests::parses_landlock_tcp_port_rules -- --exact >/tmp/12a-red.log 2>&1
          status=$?
          set -e
          cat /tmp/12a-red.log
          if [ "$status" -eq 0 ]; then
            echo "Milestone 12A policy spec unexpectedly passed before implementation" >&2
            exit 1
          fi
      - name: Materialize production implementation and integration oracle
        run: |
          python3 .github/tmp-milestone-12a.py production
          python3 .github/tmp-milestone-12a-clippy-fix.py
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Diff hygiene
        run: git diff --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Full test suite
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-12a.py
          rm .github/tmp-milestone-12a-clippy-fix.py
          rm .github/tmp-milestone-12a-test-string-fix.py
          rm .github/workflows/tmp-milestone-12a.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: enforce Landlock TCP port envelope"
          git push origin HEAD:tmp-12a-landlock-tcp-ports
