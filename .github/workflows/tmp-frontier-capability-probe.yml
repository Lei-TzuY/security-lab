name: frontier capability probe

on:
  push:
    branches: [tmp-frontier-capability-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe kernel and Landlock ABI
        run: |
          set -euxo pipefail
          uname -a
          cat > /tmp/landlock_probe.c <<'EOF'
          #include <errno.h>
          #include <linux/landlock.h>
          #include <stdio.h>
          #include <sys/syscall.h>
          #include <unistd.h>

          int main(void) {
              errno = 0;
              long abi = syscall(SYS_landlock_create_ruleset, NULL, 0, LANDLOCK_CREATE_RULESET_VERSION);
              printf("landlock_abi=%ld errno=%d\n", abi, errno);
          #ifdef LANDLOCK_CREATE_RULESET_ERRATA
              errno = 0;
              long errata = syscall(SYS_landlock_create_ruleset, NULL, 0, LANDLOCK_CREATE_RULESET_ERRATA);
              printf("landlock_errata=%ld errno=%d\n", errata, errno);
          #endif
              return abi < 0 ? 1 : 0;
          }
          EOF
          cc -Wall -Wextra -Werror -O2 /tmp/landlock_probe.c -o /tmp/landlock_probe
          /tmp/landlock_probe
      - name: Probe unprivileged cgroup-v2 delegation
        run: |
          set -uo pipefail
          id
          cat /proc/self/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          current=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)
          parent="/sys/fs/cgroup${current}"
          echo "cgroup_parent=${parent}"
          stat -c 'cgroup_parent_mode=%A owner=%U group=%G' "${parent}"
          probe="${parent}/security-lab-capability-probe-$$"
          if mkdir "${probe}" 2>/tmp/cgroup_probe.err; then
            echo 'cgroup_delegated=yes'
            rmdir "${probe}"
          else
            echo 'cgroup_delegated=no'
            cat /tmp/cgroup_probe.err
          fi
      - name: Remove probe workflow
        if: always()
        run: |
          rm .github/workflows/tmp-frontier-capability-probe.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "chore: remove frontier capability probe"
          git push origin HEAD:tmp-frontier-capability-probe
