name: materialize milestone 33A snapshot identity

on:
  push:
    branches: [tmp-33a-snapshot-identity]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Lock dependencies
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Stable tests
        run: cargo test --locked --all-targets --all-features
      - name: Install MSRV
        run: rustup toolchain install 1.74.0 --profile minimal --no-self-update
      - name: MSRV tests
        run: cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction workflow and commit candidate tree
        run: |
          rm .github/workflows/tmp-milestone-33a-snapshot-identity.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add canonical SHA-256 snapshot identity"
          git push origin HEAD:tmp-33a-snapshot-identity
