name: probe fd-pinned overlayfs construction

on:
  push:
    branches: [tmp-27a-overlayfs-capability-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable unprivileged user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build fd-pinned OverlayFS probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/security-lab-fd-overlay-probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <linux/mount.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <unistd.h>

          #ifndef FSOPEN_CLOEXEC
          #define FSOPEN_CLOEXEC 0x00000001
          #endif
          #ifndef FSMOUNT_CLOEXEC
          #define FSMOUNT_CLOEXEC 0x00000001
          #endif
          #ifndef FSCONFIG_SET_STRING
          #define FSCONFIG_SET_STRING 1
          #endif
          #ifndef FSCONFIG_CMD_CREATE
          #define FSCONFIG_CMD_CREATE 6
          #endif
          #ifndef MOUNT_ATTR_NOSUID
          #define MOUNT_ATTR_NOSUID 0x00000002
          #endif
          #ifndef MOUNT_ATTR_NODEV
          #define MOUNT_ATTR_NODEV 0x00000004
          #endif
          #ifndef MOUNT_ATTR_NOEXEC
          #define MOUNT_ATTR_NOEXEC 0x00000008
          #endif

          static void die(const char *what) {
              fprintf(stderr, "%s: errno=%d (%s)\n", what, errno, strerror(errno));
              exit(1);
          }

          static int xopenat(int dfd, const char *path, int flags) {
              int fd = openat(dfd, path, flags, 0);
              if (fd < 0) die(path);
              return fd;
          }

          static void read_exact_text_at(int dfd, const char *path, const char *expected) {
              int fd = openat(dfd, path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) die(path);
              char buf[128];
              ssize_t n = read(fd, buf, sizeof(buf));
              if (n < 0) die("read");
              close(fd);
              size_t want = strlen(expected);
              if ((size_t)n != want || memcmp(buf, expected, want) != 0) {
                  fprintf(stderr, "%s: unexpected content length=%zd\n", path, n);
                  exit(2);
              }
          }

          static void fd_path(char *out, size_t cap, int fd) {
              int n = snprintf(out, cap, "/proc/self/fd/%d", fd);
              if (n < 0 || (size_t)n >= cap) {
                  fprintf(stderr, "fd path overflow\n");
                  exit(3);
              }
          }

          static void show_fd(const char *label, int fd) {
              char path[64], target[256];
              fd_path(path, sizeof(path), fd);
              ssize_t n = readlink(path, target, sizeof(target) - 1);
              if (n < 0) die("readlink fd");
              target[n] = '\0';
              printf("%s fd=%d target=%s\n", label, fd, target);
          }

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: probe LOWER MERGED\n");
                  return 64;
              }
              const char *lower = argv[1];
              const char *merged = argv[2];

              if (mount(NULL, "/", NULL, MS_REC | MS_PRIVATE, NULL) < 0)
                  die("mount propagation private");

              int lower_fd = open(lower, O_PATH | O_DIRECTORY | O_CLOEXEC);
              if (lower_fd < 0) die("open pinned lower");
              show_fd("lower", lower_fd);

              int fsfd = syscall(SYS_fsopen, "tmpfs", FSOPEN_CLOEXEC);
              if (fsfd < 0) die("fsopen tmpfs");
              if (syscall(SYS_fsconfig, fsfd, FSCONFIG_SET_STRING, "size", "16777216", 0) < 0)
                  die("fsconfig tmpfs size");
              if (syscall(SYS_fsconfig, fsfd, FSCONFIG_SET_STRING, "mode", "0700", 0) < 0)
                  die("fsconfig tmpfs mode");
              if (syscall(SYS_fsconfig, fsfd, FSCONFIG_CMD_CREATE, NULL, NULL, 0) < 0)
                  die("fsconfig tmpfs create");

              unsigned int attrs = MOUNT_ATTR_NOSUID | MOUNT_ATTR_NODEV | MOUNT_ATTR_NOEXEC;
              int state_fd = syscall(SYS_fsmount, fsfd, FSMOUNT_CLOEXEC, attrs);
              if (state_fd < 0) die("fsmount detached tmpfs");
              close(fsfd);
              show_fd("state-mount", state_fd);

              if (mkdirat(state_fd, "upper", 0700) < 0) die("mkdirat detached upper");
              if (mkdirat(state_fd, "work", 0700) < 0) die("mkdirat detached work");
              int upper_fd = xopenat(state_fd, "upper", O_PATH | O_DIRECTORY | O_CLOEXEC);
              int work_fd = xopenat(state_fd, "work", O_PATH | O_DIRECTORY | O_CLOEXEC);
              show_fd("upper", upper_fd);
              show_fd("work", work_fd);

              char lower_path[64], upper_path[64], work_path[64], options[256];
              fd_path(lower_path, sizeof(lower_path), lower_fd);
              fd_path(upper_path, sizeof(upper_path), upper_fd);
              fd_path(work_path, sizeof(work_path), work_fd);
              int optn = snprintf(options, sizeof(options),
                  "lowerdir=%s,upperdir=%s,workdir=%s",
                  lower_path, upper_path, work_path);
              if (optn < 0 || (size_t)optn >= sizeof(options)) {
                  fprintf(stderr, "overlay options overflow\n");
                  return 65;
              }
              printf("overlay options=%s\n", options);

              if (mount("overlay", merged, "overlay", 0, options) < 0)
                  die("mount overlay from fd paths");

              int merged_fd = open(merged, O_PATH | O_DIRECTORY | O_CLOEXEC);
              if (merged_fd < 0) die("open merged");
              read_exact_text_at(merged_fd, "base", "lower-original\n");
              read_exact_text_at(merged_fd, "dir/child", "lower-child\n");

              int fd = openat(merged_fd, "base", O_WRONLY | O_TRUNC | O_CLOEXEC);
              if (fd < 0) die("copy-up base open");
              const char replaced[] = "overlay-replaced\n";
              if (write(fd, replaced, sizeof(replaced) - 1) != (ssize_t)(sizeof(replaced) - 1))
                  die("copy-up base write");
              close(fd);

              fd = openat(merged_fd, "new", O_WRONLY | O_CREAT | O_EXCL | O_CLOEXEC, 0600);
              if (fd < 0) die("create overlay new");
              const char added[] = "overlay-new\n";
              if (write(fd, added, sizeof(added) - 1) != (ssize_t)(sizeof(added) - 1))
                  die("write overlay new");
              close(fd);
              if (unlinkat(merged_fd, "dir/child", 0) < 0) die("whiteout lower child");

              read_exact_text_at(merged_fd, "base", "overlay-replaced\n");
              read_exact_text_at(merged_fd, "new", "overlay-new\n");
              errno = 0;
              int gone = openat(merged_fd, "dir/child", O_RDONLY | O_CLOEXEC);
              if (gone >= 0 || errno != ENOENT) {
                  if (gone >= 0) close(gone);
                  fprintf(stderr, "whiteout not effective: errno=%d\n", errno);
                  return 66;
              }

              read_exact_text_at(lower_fd, "base", "lower-original\n");
              read_exact_text_at(lower_fd, "dir/child", "lower-child\n");
              read_exact_text_at(upper_fd, "base", "overlay-replaced\n");
              read_exact_text_at(upper_fd, "new", "overlay-new\n");

              close(merged_fd);
              if (umount2(merged, MNT_DETACH) < 0) die("unmount merged");
              close(work_fd);
              close(upper_fd);
              close(state_fd);
              close(lower_fd);
              puts("RESULT: fd-pinned lower and detached-tmpfs upper/work are accepted by OverlayFS through /proc/self/fd without pathname re-resolution.");
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -O2 /tmp/security-lab-fd-overlay-probe.c -o /tmp/security-lab-fd-overlay-probe
      - name: Exercise fd-pinned detached OverlayFS
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          base="$(mktemp -d /tmp/security-lab-fd-overlay.XXXXXX)"
          mkdir -p "$base/lower/dir" "$base/merged"
          printf 'lower-original\n' > "$base/lower/base"
          printf 'lower-child\n' > "$base/lower/dir/child"
          lower_base_hash="$(sha256sum "$base/lower/base" | awk '{print $1}')"
          lower_child_hash="$(sha256sum "$base/lower/dir/child" | awk '{print $1}')"

          unshare --user --map-root-user --mount -- \
            /tmp/security-lab-fd-overlay-probe "$base/lower" "$base/merged"

          test "$(sha256sum "$base/lower/base" | awk '{print $1}')" = "$lower_base_hash"
          test "$(sha256sum "$base/lower/dir/child" | awk '{print $1}')" = "$lower_child_hash"
          test "$(cat "$base/lower/base")" = "lower-original"
          test "$(cat "$base/lower/dir/child")" = "lower-child"
          test ! -e "$base/lower/new"
          test -z "$(find "$base/merged" -mindepth 1 -print -quit)"
          rm -rf "$base"
      - name: Remove probe workflow
        if: always()
        run: |
          rm .github/workflows/tmp-27a-overlayfs-capability-probe.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "chore: clean fd-pinned overlayfs probe" || exit 0
          git push origin HEAD:tmp-27a-overlayfs-capability-probe
