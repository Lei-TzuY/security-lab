name: refine milestone 27C assurance naming

on:
  push:
    branches: [tmp-27c-format]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Refine assurance naming
        run: |
          sed -i 's/safe_for_unreviewed_update/static_non_widening/g' src/authority_delta.rs tests/authority_delta_cli.rs
          sed -i 's/safe-for-unreviewed-update/static-non-widening/g' src/authority_delta.rs tests/authority_delta_cli.rs
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction workflow and commit candidate tree
        run: |
          rm .github/workflows/tmp-27c-naming.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "refactor: narrow authority delta assurance claim"
          git push origin HEAD:tmp-27c-format
