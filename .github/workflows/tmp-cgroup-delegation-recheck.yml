name: cgroup delegation recheck

on:
  push:
    branches: [tmp-4a-cgroup-delegation-recheck]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe unprivileged cgroup-v2 delegation
        shell: bash
        run: |
          set -euo pipefail

          uid="$(id -u)"
          gid="$(id -g)"
          echo "runtime uid=${uid} gid=${gid}"
          if [ "${uid}" -eq 0 ]; then
            echo "::error::probe must run as the ordinary Actions runtime user, not root"
            exit 40
          fi

          if [ ! -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "::error::unified cgroup v2 is not mounted"
            exit 41
          fi

          rel="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          base="/sys/fs/cgroup${rel}"
          echo "self cgroup=${rel}"
          echo "base=${base}"
          stat -c 'base owner=%u:%g mode=%a' "${base}"
          printf 'controllers='; cat "${base}/cgroup.controllers"
          printf 'subtree_control='; cat "${base}/cgroup.subtree_control"

          probe="${base}/security-lab-delegation-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          child=""
          cleanup() {
            if [ -n "${child}" ]; then
              kill "${child}" 2>/dev/null || true
              wait "${child}" 2>/dev/null || true
            fi
            rmdir "${probe}" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! mkdir "${probe}"; then
            echo "::error::runtime user cannot create a child cgroup beneath its current cgroup"
            exit 42
          fi
          stat -c 'child owner=%u:%g mode=%a' "${probe}"

          if [ ! -f "${probe}/pids.max" ]; then
            echo "::error::pids controller is not delegated into the new child cgroup"
            exit 43
          fi
          if ! printf '8\n' > "${probe}/pids.max"; then
            echo "::error::runtime user cannot set pids.max in its child cgroup"
            exit 44
          fi
          if [ "$(cat "${probe}/pids.max")" != "8" ]; then
            echo "::error::pids.max did not retain the requested limit"
            exit 45
          fi

          sleep 60 &
          child=$!
          if ! printf '%s\n' "${child}" > "${probe}/cgroup.procs"; then
            echo "::error::runtime user cannot attach its child process to the delegated cgroup"
            exit 46
          fi
          if ! grep -qx "${child}" "${probe}/cgroup.procs"; then
            echo "::error::child process was not observed in delegated cgroup.procs"
            exit 47
          fi

          kill "${child}"
          wait "${child}" 2>/dev/null || true
          child=""
          rmdir "${probe}"
          trap - EXIT
          echo "CGROUP_DELEGATION_USABLE=1"
