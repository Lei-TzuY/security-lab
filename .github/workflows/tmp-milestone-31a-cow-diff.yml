name: materialize milestone 31A cow diff

on:
  push:
    branches: [tmp-31a-cow-diff-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Align generator with exact 30A root return
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp-milestone-31a-cow-diff.py')
          text = p.read_text()
          old = '            close_setup_fd(current_root_fd);\\n            mark_enforcement(launch_error, ENFORCEMENT_READONLY_ROOT);\\n            return lower_tree_fd;\\n'
          current = '            mark_enforcement(launch_error, ENFORCEMENT_READONLY_ROOT);\\n            return lower_tree_fd;\\n'
          if text.count(old) != 1:
              raise SystemExit(f'old readonly anchor count={text.count(old)}')
          text = text.replace(old, current, 1)
          old_new = '            close_setup_fd(current_root_fd);\\n            mark_enforcement(launch_error, ENFORCEMENT_READONLY_ROOT);\\n            return (lower_tree_fd, -1);\\n'
          current_new = '            mark_enforcement(launch_error, ENFORCEMENT_READONLY_ROOT);\\n            return (lower_tree_fd, -1);\\n'
          if text.count(old_new) != 1:
              raise SystemExit(f'new readonly anchor count={text.count(old_new)}')
          p.write_text(text.replace(old_new, current_new, 1))
          PY
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-31a-cow-diff.py
      - name: Tighten generated ownership and traversal bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cow = Path('src/platform/linux_cow_diff.rs')
          text = cow.read_text()
          text = text.replace(
              'const DIRENT_BUFFER_BYTES: usize = 8192;\n',
              'const DIRENT_BUFFER_BYTES: usize = 8192;\nconst MAX_EXPORT_DEPTH: usize = 64;\n',
              1,
          )
          old = '    let result = walk_directory(root_fd, state, &mut path, 0);\n    let close_result = libc::close(root_fd);\n    if let Err(errno) = result {\n        return Err(errno);\n    }\n'
          new = '    let result = walk_directory(root_fd, state, &mut path, 0, 0);\n    let close_result = libc::close(root_fd);\n    result?;\n'
          if text.count(old) != 1:
              raise SystemExit(f'root walk result anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    path: &mut [u8; PATH_BYTES_MAX],\n    path_len: usize,\n) -> Result<(), i32> {\n    let mut buffer = [0u8; DIRENT_BUFFER_BYTES];\n'
          new = '    path: &mut [u8; PATH_BYTES_MAX],\n    path_len: usize,\n    depth: usize,\n) -> Result<(), i32> {\n    if depth > MAX_EXPORT_DEPTH {\n        return Err(libc::ELOOP);\n    }\n    let mut buffer = [0u8; DIRENT_BUFFER_BYTES];\n'
          if text.count(old) != 1:
              raise SystemExit(f'walk signature anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '                export_entry(directory_fd, name_ptr, state, path, next_len)?;\n'
          new = '                export_entry(directory_fd, name_ptr, state, path, next_len, depth)?;\n'
          if text.count(old) != 1:
              raise SystemExit(f'export entry call anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    path: &mut [u8; PATH_BYTES_MAX],\n    path_len: usize,\n) -> Result<(), i32> {\n    let mut stat = std::mem::zeroed::<libc::stat>();\n'
          new = '    path: &mut [u8; PATH_BYTES_MAX],\n    path_len: usize,\n    depth: usize,\n) -> Result<(), i32> {\n    let mut stat = std::mem::zeroed::<libc::stat>();\n'
          if text.count(old) != 1:
              raise SystemExit(f'export entry signature anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '        let result = walk_directory(fd, state, path, path_len);\n        let close_result = libc::close(fd);\n        if let Err(errno) = result {\n            return Err(errno);\n        }\n'
          new = '        let result = walk_directory(fd, state, path, path_len, depth + 1);\n        let close_result = libc::close(fd);\n        result?;\n'
          if text.count(old) != 1:
              raise SystemExit(f'recursive walk result anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '        let result = append_file(state, &path[..path_len], fd, stat.st_size as usize);\n        let close_result = libc::close(fd);\n        if let Err(errno) = result {\n            return Err(errno);\n        }\n'
          new = '        let result = append_file(state, &path[..path_len], fd, stat.st_size as usize);\n        let close_result = libc::close(fd);\n        result?;\n'
          if text.count(old) != 1:
              raise SystemExit(f'file result anchor count={text.count(old)}')
          cow.write_text(text.replace(old, new, 1))

          lifecycle = Path('src/platform/linux_pid_lifecycle.rs')
          text = lifecycle.read_text()
          old = 'pub(super) unsafe fn become_direct_target_or_reap(\n    lifecycle: *mut TargetLifecycleRecord,\n'
          new = 'pub(super) struct CowDiffControl {\n    pub(super) upper_fd: libc::c_int,\n    pub(super) state: *mut CowDiffState,\n}\n\npub(super) unsafe fn become_direct_target_or_reap(\n    lifecycle: *mut TargetLifecycleRecord,\n'
          if text.count(old) != 1:
              raise SystemExit(f'cow control struct anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    output_limit_fd: libc::c_int,\n    cow_upper_fd: libc::c_int,\n    cow_diff_state: *mut CowDiffState,\n    phases: TargetSupervisionPhases,\n) {\n'
          new = '    output_limit_fd: libc::c_int,\n    cow_diff: CowDiffControl,\n    phases: TargetSupervisionPhases,\n) {\n    let CowDiffControl {\n        upper_fd: cow_upper_fd,\n        state: cow_diff_state,\n    } = cow_diff;\n'
          if text.count(old) != 1:
              raise SystemExit(f'cow control signature anchor count={text.count(old)}')
          lifecycle.write_text(text.replace(old, new, 1))

          linux = Path('src/platform/linux.rs')
          text = linux.read_text()
          old = '        become_direct_target_or_reap, become_pid_namespace_init_or_exit, LaunchErrorRecord,\n        SharedTargetLifecycle, TargetLifecycleRecord, TargetSupervisionPhases,\n'
          new = '        become_direct_target_or_reap, become_pid_namespace_init_or_exit, CowDiffControl, LaunchErrorRecord,\n        SharedTargetLifecycle, TargetLifecycleRecord, TargetSupervisionPhases,\n'
          if text.count(old) != 1:
              raise SystemExit(f'lifecycle import anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '            output_limit_fd,\n            cow_upper_fd,\n            cow_diff_state,\n            TargetSupervisionPhases {\n'
          new = '            output_limit_fd,\n            CowDiffControl {\n                upper_fd: cow_upper_fd,\n                state: cow_diff_state,\n            },\n            TargetSupervisionPhases {\n'
          if text.count(old) != 1:
              raise SystemExit(f'lifecycle call anchor count={text.count(old)}')
          linux.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-31a-cow-diff.py
          rm .github/workflows/tmp-milestone-31a-cow-diff.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: export bounded copy-on-write root diff"
          git push origin HEAD:tmp-31a-cow-diff-generator
