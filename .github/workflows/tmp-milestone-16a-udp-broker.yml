name: materialize milestone 16A UDP broker

on:
  push:
    branches: [tmp-16a-udp-broker-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate
        run: python3 .github/tmp-milestone-16a-udp-broker.py
      - name: Preserve generated UDP policy test line boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/policy.rs")
          text = path.read_text()
          start = text.index("    fn parses_brokered_host_ipv4_udp_endpoint()")
          end = text.index("    fn parses_brokered_host_loopback_tcp_listener()", start)
          section = text[start:end]
          for key in (
              "network.host_ipv4_udp_address",
              "network.host_ipv4_udp_port",
              "network.host_ipv4_udp_target_fd",
              "network.host_ipv4_tcp_address",
              "network.host_ipv4_tcp_port",
              "network.host_ipv4_tcp_target_fd",
              "handle.13",
          ):
              section = section.replace("\\" + "\n" + key, r"\n" + key)
          text = text[:start] + section + text[end:]
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-16a-udp-broker.py
          rm .github/workflows/tmp-milestone-16a-udp-broker.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: broker exact host IPv4 UDP endpoint"
          git push origin HEAD:tmp-16a-udp-broker-generator
