          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum HostUnixFdReceivePolicy {
              /// A launcher-owned mediator accepts exactly one SCM_RIGHTS descriptor,
              /// requires a regular file opened O_RDONLY, then forwards only that FD.
              ReadOnlyRegularFile,
          }
          ''',
              "policy receive enum",
