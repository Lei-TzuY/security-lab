name: materialize milestone 41B rustfmt fix

on:
  push:
    branches: [tmp-41b-rustfmt-fix]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format candidate
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Stable format check
        run: cargo fmt --all -- --check
      - name: Stable Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Stable full tests
        run: cargo test --locked --all-targets --all-features
      - name: Install MSRV
        run: rustup toolchain install 1.74.0 --profile minimal --no-self-update
      - name: MSRV full tests
        run: cargo +1.74.0 test --locked --all-targets --all-features
      - name: Remove construction file and commit formatted tree
        run: |
          rm .github/workflows/tmp-41b-rustfmt-fix.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "style: format persisted trust state"
          git push origin HEAD:tmp-41b-rustfmt-fix
