name: construct milestone 3A candidate

on:
  push:
    branches: ["tmp-3a-generator"]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: tmp-3a-generator
      - name: Materialize PID lifecycle candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          linux_path = Path("src/platform/linux.rs")
          text = linux_path.read_text()

          text = replace_once(
              text,
              '#[cfg(target_arch = "x86_64")]\nmod x86_64 {\n    use crate::policy::{StdioMode, StdioPolicy};',
              '#[cfg(target_arch = "x86_64")]\n#[path = "linux_pid_lifecycle.rs"]\nmod pid_lifecycle;\n\n#[cfg(target_arch = "x86_64")]\nmod x86_64 {\n    use super::pid_lifecycle::{self, LaunchErrorRecord, SharedTargetLifecycle, TargetLifecycleRecord};\n    use crate::policy::{StdioMode, StdioPolicy};',
              "linux module import",
          )

          text = replace_once(
              text,
              '    const PHASE_STDOUT_CAPTURE: u32 = 28;\n\n    #[repr(C)]\n    #[derive(Clone, Copy)]\n    struct LaunchErrorRecord {\n        errno: i32,\n        phase: u32,\n    }',
              '    const PHASE_STDOUT_CAPTURE: u32 = 28;\n    const PHASE_PID_INIT_FORK: u32 = 29;\n    const PHASE_TARGET_FORK: u32 = 30;\n    const PHASE_PROCESS_TREE_KILL: u32 = 31;\n    const PHASE_PROCESS_TREE_REAP: u32 = 32;\n    const PHASE_PID_INIT_WAIT: u32 = 33;',
              "lifecycle phases and shared launch record",
          )

          text = replace_once(
              text,
              '        let launch_state = SharedLaunchState::new()?;\n        let capture = if policy.stdio.stdout == StdioMode::Capture {',
              '        let launch_state = SharedLaunchState::new()?;\n        let lifecycle = SharedTargetLifecycle::new().map_err(|err| {\n            SandboxError::SetupFailed(format!(\n                "cannot allocate shared target lifecycle state: {err}"\n            ))\n        })?;\n        let capture = if policy.stdio.stdout == StdioMode::Capture {',
              "allocate lifecycle state",
          )

          text = replace_once(
              text,
              '                    &seccomp,\n                    launch_state.record,\n                    capture_read_fd,',
              '                    &seccomp,\n                    launch_state.record,\n                    lifecycle.raw(),\n                    capture_read_fd,',
              "pass lifecycle state",
          )

          old_result = '''        let status = wait_for_child(pid)?;
        let launch_error = launch_state.snapshot();
        if launch_error.phase != 0 {
            return decode_launch_error(launch_error).map(|outcome| RunReport {
                outcome,
                stdout: None,
            });
        }

        let stdout = match capture_result {
            Some(result) => Some(result?),
            None => None,
        };
        let outcome = decode_wait_status(status)?;
        Ok(RunReport { outcome, stdout })'''
          new_result = '''        let bootstrap_status = wait_for_child(pid)?;
        let launch_error = launch_state.snapshot();
        if launch_error.phase != 0 {
            return decode_launch_error(launch_error).map(|outcome| RunReport {
                outcome,
                stdout: None,
                reaped_descendants: 0,
            });
        }

        let lifecycle_record = lifecycle.snapshot();
        if lifecycle_record.ready != 1 {
            return Err(SandboxError::SetupFailed(format!(
                "PID namespace lifecycle did not publish target status; bootstrap wait status 0x{bootstrap_status:x}"
            )));
        }

        let stdout = match capture_result {
            Some(result) => Some(result?),
            None => None,
        };
        let outcome = decode_wait_status(lifecycle_record.status)?;
        Ok(RunReport {
            outcome,
            stdout,
            reaped_descendants: lifecycle_record.reaped_descendants,
        })'''
          text = replace_once(text, old_result, new_result, "decode direct target lifecycle")

          text = replace_once(
              text,
              '        seccomp: &CompiledSeccomp,\n        launch_error: *mut LaunchErrorRecord,\n        capture_read_fd: RawFd,',
              '        seccomp: &CompiledSeccomp,\n        launch_error: *mut LaunchErrorRecord,\n        target_lifecycle: *mut TargetLifecycleRecord,\n        capture_read_fd: RawFd,',
              "child lifecycle argument",
          )

          text = replace_once(
              text,
              'libc::SYS_unshare, libc::CLONE_NEWUSER | libc::CLONE_NEWNS',
              'libc::SYS_unshare, libc::CLONE_NEWUSER | libc::CLONE_NEWNS | libc::CLONE_NEWPID',
              "PID namespace unshare",
          )

          cloexec_block = '''        if libc::syscall(
            libc::SYS_close_range,
            FIRST_NON_STDIO_FD,
            u32::MAX,
            CLOSE_RANGE_CLOEXEC,
        ) == -1
        {
            child_fail(launch_error, PHASE_FD_SANITIZE, seccomp.error_exit_syscall);
        }

        apply_stdio_policy_or_fail('''
          lifecycle_block = '''        if libc::syscall(
            libc::SYS_close_range,
            FIRST_NON_STDIO_FD,
            u32::MAX,
            CLOSE_RANGE_CLOEXEC,
        ) == -1
        {
            child_fail(launch_error, PHASE_FD_SANITIZE, seccomp.error_exit_syscall);
        }

        pid_lifecycle::become_pid_namespace_init_or_exit(
            launch_error,
            PHASE_PID_INIT_FORK,
            PHASE_PID_INIT_WAIT,
            PHASE_FD_SANITIZE,
        );
        pid_lifecycle::become_direct_target_or_reap(
            target_lifecycle,
            launch_error,
            PHASE_TARGET_FORK,
            PHASE_PROCESS_TREE_KILL,
            PHASE_PROCESS_TREE_REAP,
            PHASE_FD_SANITIZE,
        );

        apply_stdio_policy_or_fail('''
          text = replace_once(text, cloexec_block, lifecycle_block, "insert PID lifecycle forks")

          text = replace_once(
              text,
              '            PHASE_STDOUT_CAPTURE => "bounded stdout capture",\n            _ => "unknown launch phase",',
              '            PHASE_STDOUT_CAPTURE => "bounded stdout capture",\n            PHASE_PID_INIT_FORK => "PID namespace init fork",\n            PHASE_TARGET_FORK => "direct target fork",\n            PHASE_PROCESS_TREE_KILL => "process-tree termination",\n            PHASE_PROCESS_TREE_REAP => "process-tree reaping",\n            PHASE_PID_INIT_WAIT => "PID namespace init wait",\n            _ => "unknown launch phase",',
              "lifecycle phase diagnostics",
          )

          text = replace_once(
              text,
              '            "getpid" => libc::SYS_getpid,\n            "sched_yield" => libc::SYS_sched_yield,',
              '            "getpid" => libc::SYS_getpid,\n            "getppid" => libc::SYS_getppid,\n            "fork" => libc::SYS_fork,\n            "pause" => libc::SYS_pause,\n            "sched_yield" => libc::SYS_sched_yield,',
              "lifecycle target syscalls",
          )

          linux_path.write_text(text)

          report_path = Path("src/report.rs")
          report = report_path.read_text()
          report = replace_once(
              report,
              '/// Detailed result for callers that need launcher-owned captured output.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct RunReport {\n    pub outcome: ChildOutcome,\n    /// Present exactly when stdout was configured as `capture`.\n    pub stdout: Option<CapturedOutput>,\n}',
              '/// Detailed result for callers that need launcher-owned captured output or process-tree lifecycle evidence.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct RunReport {\n    /// Terminal status of the direct target, not of the namespace init.\n    pub outcome: ChildOutcome,\n    /// Present exactly when stdout was configured as `capture`.\n    pub stdout: Option<CapturedOutput>,\n    /// Additional orphaned descendants reaped by the launcher-owned PID 1 after the direct target terminated.\n    pub reaped_descendants: u32,\n}',
              "RunReport lifecycle evidence",
          )
          report = report.replace(
              '/// Observable terminal status of a sandboxed child.',
              '/// Observable terminal status of the direct sandbox target.',
              1,
          )
          report_path.write_text(report)

          probe_path = Path("tests/fixtures/probe.S")
          probe = probe_path.read_text()
          probe = replace_once(
              probe,
              '#   V emit 256 KiB through stdout to exercise bounded launcher-owned capture\n',
              '#   V emit 256 KiB through stdout to exercise bounded launcher-owned capture\n#   Y assert direct target is PID 2 with launcher-owned namespace init as PID 1\n#   Z fork a live descendant that must be killed/reaped by namespace init\n',
              "probe mode docs",
          )
          probe = replace_once(
              probe,
              '    cmp $86, %al\n    je .stdio_stdout_capture_stress\n    jmp .fail2',
              '    cmp $86, %al\n    je .stdio_stdout_capture_stress\n    cmp $89, %al\n    je .pid_namespace_identity\n    cmp $90, %al\n    je .live_descendant\n    jmp .fail2',
              "probe mode dispatch",
          )
          probe = replace_once(
              probe,
              '''.capture_stress_done:
    xor %edi, %edi
    jmp .exit

.str_eq:''',
              '''.capture_stress_done:
    xor %edi, %edi
    jmp .exit

.pid_namespace_identity:
    mov $39, %eax
    syscall
    cmp $2, %rax
    jne .fail23
    mov $110, %eax
    syscall
    cmp $1, %rax
    jne .fail23
    xor %edi, %edi
    jmp .exit

.live_descendant:
    mov $57, %eax
    syscall
    test %rax, %rax
    js .fail24
    jz .descendant_pause
    xor %edi, %edi
    jmp .exit
.descendant_pause:
    mov $34, %eax
    syscall
    jmp .descendant_pause

.str_eq:''',
              "probe lifecycle bodies",
          )
          probe = replace_once(
              probe,
              '''.fail22:
    mov $22, %edi

.exit:''',
              '''.fail22:
    mov $22, %edi
    jmp .exit
.fail23:
    mov $23, %edi
    jmp .exit
.fail24:
    mov $24, %edi

.exit:''',
              "probe lifecycle failures",
          )
          probe_path.write_text(probe)

          tests_path = Path("tests/sandbox.rs")
          tests = tests_path.read_text()
          anchor = '''#[test]
fn forbidden_syscall_is_denied_with_eperm() {'''
          addition = '''#[test]
fn direct_target_is_pid2_under_launcher_owned_namespace_init() {
    let report = run_report(&policy(
        "Y",
        &[],
        &["execveat", "getpid", "getppid", "exit"],
    ))
    .unwrap();

    assert_eq!(report.outcome, ChildOutcome::Exited(0));
    assert_eq!(report.reaped_descendants, 0);
}

#[test]
fn namespace_init_kills_reaps_live_descendant_and_releases_capture() {
    let mut tree = policy("Z", &[], &["execveat", "fork", "pause", "exit"]);
    tree.stdio.stdout = StdioMode::Capture;
    tree.stdout_capture_bytes = Some(1024);

    let report = run_report(&tree).unwrap();
    assert_eq!(report.outcome, ChildOutcome::Exited(0));
    assert_eq!(report.reaped_descendants, 1);
    let stdout = report.stdout.expect("capture result must be present");
    assert!(stdout.bytes.is_empty());
    assert!(!stdout.truncated);
}

#[test]
fn forbidden_syscall_is_denied_with_eperm() {'''
          tests = replace_once(tests, anchor, addition, "PID lifecycle integration tests")
          tests_path.write_text(tests)
          PY

      - name: Remove construction workflow and commit candidate tree
        shell: bash
        run: |
          rm .github/workflows/tmp-milestone-3a-generator.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add PID namespace process-tree lifecycle"
          git push origin HEAD:tmp-3a-generator
