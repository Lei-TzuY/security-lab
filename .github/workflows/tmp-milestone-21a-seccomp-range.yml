name: materialize milestone 21A seccomp ranges

on:
  push:
    branches: [tmp-21a-seccomp-range]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prove range syntax is red on current main
        run: |
          python3 .github/tmp-milestone-21a-seccomp-range.py tests
          if cargo test --locked policy::tests::parses_seccomp_argument_range_rule_syntax; then
            echo "range syntax unexpectedly passed before production implementation" >&2
            exit 1
          fi
      - name: Materialize production and deterministic evidence
        run: python3 .github/tmp-milestone-21a-seccomp-range.py production
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        run: |
          rm .github/tmp-milestone-21a-seccomp-range.py
          rm .github/workflows/tmp-milestone-21a-seccomp-range.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add 64-bit seccomp argument ranges"
          git push origin HEAD:tmp-21a-seccomp-range
