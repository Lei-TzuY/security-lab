name: probe routed network capability

on:
  push:
    branches: [tmp-routed-network-capability-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable unprivileged user namespace tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Probe host-connected veth feasibility without network privilege
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          command -v ip

          host_uid="$(id -u)"
          host_pid="$$"
          host_net="$(readlink /proc/self/ns/net)"
          echo "host uid=${host_uid} netns=${host_net}"
          grep '^CapEff:' /proc/self/status
          test "${host_uid}" -ne 0

          export HOST_PID="${host_pid}"
          export HOST_NET="${host_net}"

          unshare --user --map-root-user --net -- bash -c '
            set -euo pipefail
            child_net="$(readlink /proc/self/ns/net)"
            echo "owned user+net namespace: uid=$(id -u) netns=${child_net}"
            grep "^CapEff:" /proc/self/status
            test "${child_net}" != "${HOST_NET}"

            # CAP_NET_ADMIN in the user-owned network namespace is sufficient
            # to create and configure a local veth pair.
            ip link add slveth0 type veth peer name slveth1
            ip link set slveth0 up
            ip link set slveth1 up
            ip -details link show slveth0

            # A routed topology needs a peer outside this isolated namespace.
            # Moving the peer back to the runner host netns must not silently
            # succeed for the unprivileged runtime user.
            if ip link set slveth1 netns "${HOST_PID}" 2>move.err; then
              echo "unexpectedly moved a veth peer into the host network namespace" >&2
              exit 20
            fi
            cat move.err
            if ! grep -Eiq "operation not permitted|permission denied" move.err; then
              echo "unexpected veth export failure mode" >&2
              exit 21
            fi
          '

          # The workflow user also lacks host-netns CAP_NET_ADMIN directly.
          if ip link add hostprobe0 type veth peer name hostprobe1 2>host.err; then
            ip link del hostprobe0 || true
            echo "unexpectedly created a veth in the host network namespace" >&2
            exit 22
          fi
          cat host.err
          if ! grep -Eiq "operation not permitted|permission denied" host.err; then
            echo "unexpected host veth failure mode" >&2
            exit 23
          fi

          echo "RESULT: local veth works inside the owned netns, but no peer can be attached to the host netns without additional network authority."
