name: refine milestone 3A clippy surface

on:
  push:
    branches: ["tmp-3a-generator"]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: tmp-3a-generator
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Refine child control bundle
        run: python3 tools/tmp_milestone_3a_clippy.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove construction files and commit refined tree
        shell: bash
        run: |
          rm tools/tmp_milestone_3a_clippy.py
          rm .github/workflows/tmp-milestone-3a-clippy.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "refactor: bundle PID lifecycle child controls"
          git push origin HEAD:tmp-3a-generator
