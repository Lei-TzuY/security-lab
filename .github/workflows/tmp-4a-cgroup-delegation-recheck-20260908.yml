name: recheck unprivileged cgroup delegation

on:
  push:
    branches: [tmp-4a-cgroup-delegation-recheck-20260908]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe runtime-user cgroup v2 delegation
        shell: bash
        run: |
          set -u -o pipefail
          echo "probe.uid=$(id -u)"
          echo "probe.gid=$(id -g)"
          echo "probe.id=$(id)"
          echo "probe.fs_type=$(stat -fc %T /sys/fs/cgroup 2>/dev/null || true)"
          echo "probe.controllers=$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || true)"
          echo "probe.proc_cgroup=$(cat /proc/self/cgroup 2>/dev/null || true)"

          rel=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)
          base="/sys/fs/cgroup${rel}"
          echo "probe.base=${base}"
          stat -c 'probe.base_stat=uid:%u gid:%g mode:%a owner:%U group:%G' "${base}" 2>/dev/null || true
          echo "probe.base_controllers=$(cat "${base}/cgroup.controllers" 2>/dev/null || true)"
          echo "probe.base_subtree_control=$(cat "${base}/cgroup.subtree_control" 2>/dev/null || true)"

          probe="${base}/security-lab-delegation-probe-$$"
          mkdir_err=$(mktemp)
          if mkdir "${probe}" 2>"${mkdir_err}"; then
            echo "probe.child_create=ok"
            echo "probe.child_pids_max_present=$([ -e "${probe}/pids.max" ] && echo yes || echo no)"
            if [ -e "${probe}/pids.max" ]; then
              if printf '1\n' > "${probe}/pids.max" 2>/tmp/security-lab-pids-max.err; then
                echo "probe.pids_max_write=ok"
              else
                echo "probe.pids_max_write=denied"
                sed 's/^/probe.pids_max_error=/' /tmp/security-lab-pids-max.err || true
              fi
            fi

            sleep 30 &
            child=$!
            if printf '%s\n' "${child}" > "${probe}/cgroup.procs" 2>/tmp/security-lab-attach.err; then
              echo "probe.child_attach=ok"
            else
              echo "probe.child_attach=denied"
              sed 's/^/probe.attach_error=/' /tmp/security-lab-attach.err || true
            fi
            kill "${child}" 2>/dev/null || true
            wait "${child}" 2>/dev/null || true
            rmdir "${probe}" 2>/tmp/security-lab-rmdir.err || {
              echo "probe.cleanup=failed"
              sed 's/^/probe.cleanup_error=/' /tmp/security-lab-rmdir.err || true
            }
            echo "probe.delegation_candidate=yes"
          else
            echo "probe.child_create=denied"
            sed 's/^/probe.mkdir_error=/' "${mkdir_err}" || true
            echo "probe.delegation_candidate=no"
          fi
          rm -f "${mkdir_err}" /tmp/security-lab-pids-max.err /tmp/security-lab-attach.err /tmp/security-lab-rmdir.err
      - name: Remove temporary probe workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-4a-cgroup-delegation-recheck-20260908.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "chore: remove cgroup delegation recheck"
          git push origin HEAD:tmp-4a-cgroup-delegation-recheck-20260908
