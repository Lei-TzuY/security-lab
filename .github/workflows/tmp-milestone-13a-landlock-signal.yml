name: materialize milestone 13A Landlock signal scope

on:
  push:
    branches: [tmp-13a-landlock-signal-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Switch construction to latest main
        run: |
          cp .github/tmp-milestone-13a-landlock-signal.py /tmp/milestone-13a-landlock-signal.py
          git fetch --depth=1 origin main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "7682d2a2babef0d059fd28ba05da0f7d67765fba"
      - name: Materialize candidate
        run: python3 /tmp/milestone-13a-landlock-signal.py
      - name: Use same-namespace PID1 signal oracle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          linux = Path('src/platform/linux.rs')
          text = linux.read_text()
          old = '            "pidfd_send_signal" => libc::SYS_pidfd_send_signal,\n'
          new = (
              '            "pidfd_open" => libc::SYS_pidfd_open,\n'
              '            "pidfd_send_signal" => libc::SYS_pidfd_send_signal,\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'pidfd syscall mapping matches={text.count(old)}')
          linux.write_text(text.replace(old, new, 1))

          tests = Path('tests/sandbox.rs')
          text = tests.read_text()
          replacement = '''#[test]
          fn landlock_signal_scope_attenuates_namespace_init_signal_permission() {
              let unscoped = policy(
                  "t",
                  &[],
                  &["execveat", "pidfd_open", "pidfd_send_signal", "exit"],
              );
              assert_eq!(run(&unscoped).unwrap(), ChildOutcome::Exited(0));

              let mut scoped = policy(
                  "u",
                  &[],
                  &["execveat", "pidfd_open", "pidfd_send_signal", "exit"],
              );
              scoped.landlock_scope_signal = true;
              assert_eq!(run(&scoped).unwrap(), ChildOutcome::Exited(0));
          }

          '''
          pattern = re.compile(
              r'struct PausedExternalHelper \{.*?(?=#\[test\]\nfn landlock_read_execute_envelope_denies_visible_undeclared_path)',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'external-helper test block matches={count}')
          tests.write_text(text)

          probe = Path('tests/fixtures/probe.S')
          text = probe.read_text()
          old_comments = (
              '#   t send SIGUSR1 through selected pidfd 9; succeeds only without signal scope\n'
              '#   u send SIGUSR1 through selected pidfd 9; requires Landlock signal-scope EPERM\n'
          )
          new_comments = (
              '#   t permission-check namespace PID1 through a target-opened pidfd; unscoped succeeds\n'
              '#   u repeat the PID1 signal permission check; Landlock scope requires exact EPERM\n'
          )
          if text.count(old_comments) != 1:
              raise SystemExit(f'pidfd fixture comments matches={text.count(old_comments)}')
          text = text.replace(old_comments, new_comments, 1)
          replacement = '''.pidfd_signal_allowed:
              mov $434, %eax
              mov $1, %edi
              xor %esi, %esi
              syscall
              test %rax, %rax
              js .pidfd_open_errno
              mov %eax, %edi
              mov $424, %eax
              xor %esi, %esi
              xor %edx, %edx
              xor %r10d, %r10d
              syscall
              test %rax, %rax
              jns .pidfd_signal_ok
              neg %eax
              mov %eax, %edi
              jmp .exit
          .pidfd_signal_ok:
              xor %edi, %edi
              jmp .exit

          .pidfd_signal_denied:
              mov $434, %eax
              mov $1, %edi
              xor %esi, %esi
              syscall
              test %rax, %rax
              js .pidfd_open_errno
              mov %eax, %edi
              mov $424, %eax
              xor %esi, %esi
              xor %edx, %edx
              xor %r10d, %r10d
              syscall
              cmp $-1, %rax
              je .pidfd_signal_ok
              test %rax, %rax
              jns .pidfd_signal_unexpected_success
              neg %eax
              mov %eax, %edi
              jmp .exit
          .pidfd_signal_unexpected_success:
              mov $42, %edi
              jmp .exit

          .pidfd_open_errno:
              neg %eax
              add $100, %eax
              mov %eax, %edi
              jmp .exit

          .forbidden:
          '''
          pattern = re.compile(r'\.pidfd_signal_allowed:\n.*?\.forbidden:\n', re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'pidfd fixture block matches={count}')
          probe.write_text(text)
          PY
      - name: Format and verify scope
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/platform/linux.rs src/policy.rs tests/fixtures/probe.S tests/sandbox.rs | sort)"
          test "$actual" = "$expected"
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Focused signal-scope oracle
        run: cargo test --locked --test sandbox landlock_signal_scope_attenuates_namespace_init_signal_permission -- --exact --nocapture
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Full stable test suite
        run: cargo test --locked --all-targets --all-features
      - name: Commit clean candidate
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src/platform/linux.rs src/policy.rs tests/fixtures/probe.S tests/sandbox.rs
          git commit -m "feat: scope target signal authority with Landlock"
          git push origin HEAD:milestone-13a-landlock-signal-scope
