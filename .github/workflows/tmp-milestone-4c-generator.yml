name: construct milestone 4C IPC candidate

on:
  push:
    branches:
      - tmp-4c-ipc-generator

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Materialize IPC namespace candidate
        run: python3 .github/tmp-milestone-4c-generate.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove construction files and commit candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp-milestone-4c-generate.py
          rm .github/workflows/tmp-milestone-4c-generator.yml
          git add -A
          git diff --cached --check
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: isolate target IPC namespace"
          git push origin HEAD:tmp-4c-ipc-generator
