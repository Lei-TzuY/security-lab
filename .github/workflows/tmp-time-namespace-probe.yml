name: probe unprivileged time namespace architecture

on:
  push:
    branches: [tmp-20a-time-namespace-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Compile architecture probe
        run: cc -O2 -Wall -Wextra -Werror .github/time_namespace_probe.c -o /tmp/time_namespace_probe
      - name: Exercise user plus time namespace ordering
        run: /tmp/time_namespace_probe
      - name: Self-clean probe branch
        run: |
          rm .github/time_namespace_probe.c
          rm .github/workflows/tmp-time-namespace-probe.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "chore: remove time namespace architecture probe"
          git push origin HEAD:tmp-20a-time-namespace-probe
