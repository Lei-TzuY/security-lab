name: construct milestone 6A claims sync

on:
  push:
    branches: [tmp-6a-claims-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Materialize selected handle claims sync
        run: python3 .github/tmp-milestone-6a-claims.py
      - name: Remove construction files and commit claims tree
        run: |
          rm .github/tmp-milestone-6a-claims.py
          rm .github/workflows/tmp-milestone-6a-claims.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize selected handle guarantees"
          git push origin HEAD:tmp-6a-claims-generator
