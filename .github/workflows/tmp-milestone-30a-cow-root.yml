name: materialize milestone 30A copy-on-write root

on:
  push:
    branches: [tmp-30a-cow-root-generator]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize candidate from the proven COW-root prototype
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Lei-TzuY/security-lab/93bd8000dae9b7ba7263554601fb58e302973258/.github/tmp-milestone-27a-cow-root.py \
            -o /tmp/materialize-cow-root.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/materialize-cow-root.py')
          text = p.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one match, got {count}")\n    p.write_text(text.replace(old, new, 1))\n'''
          new = '''    if count != 1:\n        print(f"PORT-SKIP {label}: expected exactly one match, got {count}")\n        return\n    p.write_text(text.replace(old, new, 1))\n'''
          if text.count(old) != 1:
              raise SystemExit('unable to patch replace_one for drift inventory')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 /tmp/materialize-cow-root.py | tee /tmp/cow-port.log
          test "$(grep -c '^PORT-SKIP ' /tmp/cow-port.log)" -eq 1
          grep -Fx 'PORT-SKIP preflight cow json: expected exactly one match, got 0' /tmp/cow-port.log
          python3 .github/tmp-milestone-30a-current-port.py
          python3 .github/tmp-milestone-30a-fixture-port.py
      - name: Format
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Stable tests
        run: cargo test --locked --all-targets --all-features
