name: construct milestone 5A seccomp argument candidate

on:
  push:
    branches:
      - tmp-5a-seccomp-generator

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Materialize seccomp argument-filter candidate
        run: |
          python3 .github/tmp-milestone-5a-seccomp.py
          python3 .github/tmp-milestone-5a-clippy-fix.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Enable user namespace capability tests
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Remove construction files and commit candidate tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp-milestone-5a-seccomp.py
          rm .github/tmp-milestone-5a-clippy-fix.py
          rm .github/workflows/tmp-milestone-5a-generator.yml
          git add -A
          git diff --cached --check
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: filter seccomp syscall arguments"
          git push origin HEAD:tmp-5a-seccomp-generator
